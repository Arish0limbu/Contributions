<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Budi ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scene">

        <!-- Background stars -->
        <div class="stars"></div>

        <!-- Floating hearts -->
        <div class="hearts"></div>

        <!-- Cinematic credits -->
        <div class="credits-window">
            <div class="credits" id="credits">

                <div class="intro">
                    <div class="small">THIS MESSAGE IS FOR</div>
                    <div class="name">MY BUDI ❤️</div>
                </div>

                <div class="message">
                    I love u to budi 🥰🥰🥰
                </div>

                <div class="message">
                    Miss u to so much 😘
                </div>

                <div class="message">
                    Ummmaa 💋❤️
                </div>

                <div class="message">
                    You are my favorite person ❤️
                </div>

                <div class="message">
                    Every day feels better with you 🥰
                </div>

                <div class="message">
                    I love your smile 😊❤️
                </div>

                <div class="message">
                    I miss you whenever you're away 🥺
                </div>

                <div class="message">
                    You are always in my heart ❤️
                </div>

                <div class="message">
                    Forever my Budi 💕
                </div>

                <div class="ending">
                    <span>❤️</span>
                    <span>🥰</span>
                    <span>😘</span>
                    <br>
                    <small>THE END...</small>
                    <br>
                    <strong>...BUT MY LOVE NEVER ENDS ♾️</strong>
                </div>

            </div>
        </div>

        <!-- Bottom cinematic fade -->
        <div class="bottom-fade"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
